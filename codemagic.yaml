workflows:
  ios-euro-testflight:
    name: EURO IPA - TestFlight Upload Only
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      node: 22
      groups:
        - appstore_credentials
      vars:
        VELOXION_APP_REGION: euro
      # Import the existing team certificate; only the downloaded EURO profile is applied below.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.veloxion.app
    scripts:
      - name: Install, test and prepare EURO
        script: |
          npm ci
          node --test test/apple-iap.test.mjs test/app-store-setup.test.mjs test/ios-regions.test.mjs test/app-store-signing.test.mjs test/testflight.test.mjs
          node scripts/prepare-ios-region.mjs euro
          npx cap sync ios
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict/></plist>' > ios/App/App/GoogleService-Info.plist
      - name: Verify EURO profile and allocate a new build number
        script: node scripts/ci-testflight-prepare.mjs euro
      - name: Sign only with the EURO profile and build
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj --profile "$CM_BUILD_DIR/build/testflight/euro.mobileprovision"
          xcode-project build-ipa --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" --scheme App
          node scripts/verify-ios-ipa.mjs euro
    artifacts:
      - build/ios/ipa/*.ipa
      - build/testflight/*.json
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
  ios-rus-testflight:
    name: RUS IPA - TestFlight Upload Only
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      node: 22
      groups:
        - appstore_credentials
        - firebase_credentials
      vars:
        VELOXION_APP_REGION: rus
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.veloxion.app
    scripts:
      - name: Install, test and prepare RUS
        script: |
          npm ci
          node --test test/apple-iap.test.mjs test/app-store-setup.test.mjs test/ios-regions.test.mjs test/app-store-signing.test.mjs test/testflight.test.mjs
          node scripts/prepare-ios-region.mjs rus
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist
          fi
          npx cap sync ios
          if [ ! -f ios/App/App/GoogleService-Info.plist ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict/></plist>' > ios/App/App/GoogleService-Info.plist
          fi
      - name: Verify RUS profile and allocate a new build number
        script: node scripts/ci-testflight-prepare.mjs rus
      - name: Sign only with the RUS profile and build
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj --profile "$CM_BUILD_DIR/build/testflight/rus.mobileprovision"
          xcode-project build-ipa --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" --scheme App
          node scripts/verify-ios-ipa.mjs rus
    artifacts:
      - build/ios/ipa/*.ipa
      - build/testflight/*.json
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
  ios-euro-iap-setup:
    name: EURO App Store Products (No Prices or Publishing)
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      node: 22
      groups:
        - appstore_credentials
    scripts:
      - name: Verify setup automation
        script: node --test test/apple-iap.test.mjs test/app-store-setup.test.mjs test/ios-regions.test.mjs
      - name: Configure EURO consumable drafts and V2 notifications
        script: node scripts/app-store-setup.mjs --region euro --apply-metadata --output build/euro-iap/report.json
    artifacts:
      - build/euro-iap/*.json
  ios-euro-bootstrap:
    name: EURO Bundle ID and Capabilities (No Publishing)
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      node: 22
      groups:
        - appstore_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/ios-euro-app
          include: true
          source: true
    scripts:
      - name: Verify region isolation and API guards
        script: node --test test/apple-iap.test.mjs test/app-store-setup.test.mjs test/ios-regions.test.mjs
      - name: Register EURO identifier and capabilities only
        script: node scripts/app-store-euro-bootstrap.mjs --apply-bundle --output build/euro-bootstrap/report.json
    artifacts:
      - build/euro-bootstrap/*.json
  ios-euro-validation:
    name: Veloxion AI Europe - Signed Validation (No Publishing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      node: 22
      groups:
        - appstore_credentials
      vars:
        VELOXION_APP_REGION: euro
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.veloxion.app
    scripts:
      - name: Install and verify isolated EURO configuration
        script: |
          npm ci
          node --test test/apple-iap.test.mjs test/app-store-setup.test.mjs test/ios-regions.test.mjs
          node scripts/prepare-ios-region.mjs euro
          npx cap sync ios
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict/></plist>' > ios/App/App/GoogleService-Info.plist
      - name: Sign and build EURO only
        script: |
          xcode-project use-profiles
          cd ios/App
          agvtool new-version -all "$(date -u +%Y%m%d%H%M)"
          cd ../..
          xcode-project build-ipa --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
  ios-iap-setup:
    name: App Store IAP Draft Setup (No Prices or Publishing)
    max_build_duration: 20
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      node: 22
      groups:
        - appstore_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: iap/app-store-setup
          include: true
          source: true
    scripts:
      - name: Test App Store configuration automation
        script: node --test test/apple-iap.test.mjs test/app-store-setup.test.mjs
      - name: Configure consumable drafts and notifications (no prices)
        script: node scripts/app-store-setup.mjs --apply-metadata --output build/app-store-setup/report.json
    artifacts:
      - build/app-store-setup/*.json
  ios-iap-validation:
    name: iOS StoreKit Validation (No Publishing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      node: 22
      groups:
        - appstore_credentials
        - firebase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.veloxion.app
    scripts:
      - name: Install dependencies
        script: |
          npm ci
          node --test test/apple-iap.test.mjs
      - name: Audit App Store configuration (read only)
        script: node scripts/app-store-audit.mjs || echo "App Store metadata needs a separate permissions/configuration check."
      - name: Restore Firebase and sync iOS
        script: |
          node scripts/prepare-ios-region.mjs rus
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist
          fi
          npx cap sync ios
          if [ ! -f ios/App/App/GoogleService-Info.plist ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict/></plist>' > ios/App/App/GoogleService-Info.plist
          fi
      - name: Apply code signing and build
        script: |
          xcode-project use-profiles
          cd ios/App
          agvtool new-version -all "$(date -u +%Y%m%d%H%M)"
          cd ../..
          xcode-project build-ipa --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      groups:
        - appstore_credentials
        - firebase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.veloxion.app
      vars:
        BUNDLE_ID: "io.veloxion.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Restore Firebase iOS config
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST is not set, skipping iOS Firebase plist restore"
          fi
      - name: Sync Capacitor iOS
        script: |
          node scripts/prepare-ios-region.mjs rus
          npx cap sync ios
          if [ ! -f "ios/App/App/GoogleService-Info.plist" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict/>' \
              '</plist>' > ios/App/App/GoogleService-Info.plist
          fi
      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles
      - name: Set iOS build number
        script: |
          python3 - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          project = Path("ios/App/App.xcodeproj/project.pbxproj")
          plist = Path("ios/App/App/Info.plist")

          build_number = os.environ.get("IOS_BUILD_NUMBER")
          if not build_number:
              build_number = datetime.now(timezone.utc).strftime("%Y%m%d%H%M")

          project_text = project.read_text(encoding="utf-8")
          project_text, project_replacements = re.subn(
              r"CURRENT_PROJECT_VERSION = \d+;",
              f"CURRENT_PROJECT_VERSION = {build_number};",
              project_text,
          )
          project.write_text(project_text, encoding="utf-8")

          plist_text = plist.read_text(encoding="utf-8")
          plist_text, plist_replacements = re.subn(
              r"<key>CFBundleVersion</key>\s*<string>.*?</string>",
              f"<key>CFBundleVersion</key>\n\t<string>{build_number}</string>",
              plist_text,
              count=1,
              flags=re.S,
          )
          plist.write_text(plist_text, encoding="utf-8")

          print(
              f"Set iOS build number to {build_number} "
              f"(project: {project_replacements}, plist: {plist_replacements})"
          )
          PY
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
