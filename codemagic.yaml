workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: veloxion-appstore
    environment:
      groups:
        - appstore_credentials
        - firebase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.veloxion.app
      vars:
        BUNDLE_ID: "io.veloxion.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Restore Firebase iOS config
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist
          else
            echo "GOOGLE_SERVICE_INFO_PLIST is not set, skipping iOS Firebase plist restore"
          fi
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
          if [ ! -f "ios/App/App/GoogleService-Info.plist" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict/>' \
              '</plist>' > ios/App/App/GoogleService-Info.plist
          fi
      - name: Apply iOS code signing
        script: |
          xcode-project use-profiles
      - name: Set iOS build number
        script: |
          python3 - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          project = Path("ios/App/App.xcodeproj/project.pbxproj")
          plist = Path("ios/App/App/Info.plist")

          build_number = os.environ.get("IOS_BUILD_NUMBER")
          if not build_number:
              build_number = datetime.now(timezone.utc).strftime("%Y%m%d%H%M")

          project_text = project.read_text(encoding="utf-8")
          project_text, project_replacements = re.subn(
              r"CURRENT_PROJECT_VERSION = \d+;",
              f"CURRENT_PROJECT_VERSION = {build_number};",
              project_text,
          )
          project.write_text(project_text, encoding="utf-8")

          plist_text = plist.read_text(encoding="utf-8")
          plist_text, plist_replacements = re.subn(
              r"<key>CFBundleVersion</key>\s*<string>.*?</string>",
              f"<key>CFBundleVersion</key>\n\t<string>{build_number}</string>",
              plist_text,
              count=1,
              flags=re.S,
          )
          plist.write_text(plist_text, encoding="utf-8")

          print(
              f"Set iOS build number to {build_number} "
              f"(project: {project_replacements}, plist: {plist_replacements})"
          )
          PY
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
