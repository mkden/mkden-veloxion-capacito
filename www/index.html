<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#edf5f9" />
    <title>Veloxion AI</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #edf5f9; color: #152033; font: 16px system-ui, sans-serif; }
      main { width: min(88vw, 360px); text-align: center; }
      img { width: 88px; height: 88px; object-fit: contain; border-radius: 20px; }
      p { margin: 18px 0 0; line-height: 1.45; color: #526277; }
      a { display: inline-flex; margin-top: 20px; padding: 12px 20px; border-radius: 10px; background: #6269e8; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="veloxion-logo.png" alt="Veloxion AI" />
      <p>Не удалось подключиться к Veloxion. Проверьте интернет-соединение.</p>
      <a href="https://veloxion.io/lk">Повторить</a>
    </main>
  </body>
</html>
